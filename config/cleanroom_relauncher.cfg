# Configuration file

general {
    # When enabled, always show the config GUI regardless of other settings [default: false]
    B:"Always Show Config"=false

    # Class path used to launch [default: ]
    S:"Class Path"=

    # Whether to disable the update toast notification shown on the main menu. [default: false]
    B:"Disable Update Toast"=false

    # Arguments for Java JVM [default: -Xmx4g -Xms4g]
    S:"JVM Arguments"=-Xmx4g -Xms4g

    # Path to javaw.exe or java binary [default: ]
    S:"Java Path"=

    # Library path, you may point it to launcher's library path for re-using, empty for default relauncher/ [default: ]
    S:"Library Path"=

    # Path to a local Cleanroom MMC pack zip file. Leave empty to use the bundled pack. [default: ./cache/tainted_forces/cleanroom-0.6.2-alpha.zip]
    S:"Local MMC Pack Path"=./cache/tainted_forces/cleanroom-0.6.2-alpha.zip

    # Maximum attempts on downloading file. [range: 1 ~ 65535, default: 5]
    I:"Maximum Retry"=5

    # Maximum session count when downloading multiple files. [range: 1 ~ 65535, default: 5]
    I:"Maximum Session"=5

    # Put library files under directory of their group name [default: true]
    B:"Place in Group Name"=true

    # Proxy address [default: ]
    S:"Proxy Address"=

    # Proxy Port [range: 0 ~ 65535, default: 0]
    I:"Proxy Port"=0

    # Whether to show the config GUI on startup. Set to false after first successful launch. §lReset to update Cleanroom.§r [default: false]
    B:"Show Config"=true

    # When enabled, uses the specified local MMC pack zip. If no path is specified, falls back to cached or bundled pack. When disabled, always downloads latest from remote ignoring any cached pack. [default: true]
    B:"Use Local MMC Pack"=true

    # Use mirror and proxy that makes downloading from Chinese main land faster. [default: false]
    B:"Use Mirror"=false
}



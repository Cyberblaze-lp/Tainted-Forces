	#The materials that should not have hydraulic press to light plate recipes added.
	materialToLightPlateMaterialBlacklist = []
	#The materials that should not have crushing table to light plate recipes added.
	blockToLightPlateMaterialBlacklist = []
	#The materials that should not have hydraulic press to plate recipes added.
	toPlateMaterialBlacklist = []
